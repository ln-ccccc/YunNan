name: yunnan

x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USERNAME: paddle_rs
  MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
  MYSQL_DATABASE: paddle_rs
  ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  # 会话 Cookie Secure 标记（后端 configs/config.py 经 _bool_env 读取）：
  # TLS 终止后置 true，默认 false 不破坏 http 内网部署（2026-10-24 审查 P2-12）
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  FLASK_CONFIG: production
  # 运行版本自描述（2026-11-05 生产化检查）：宿主 up 前可
  # export YUNNAN_GIT_SHA=$(git rev-parse --short HEAD) 注入，/api/system/version 对账
  YUNNAN_GIT_SHA: "${YUNNAN_GIT_SHA:-unknown}"
  # 切片任务 deadline（2026-11-05 生产化检查）：gdal2tiles 卡死（非取消）时
  # 轮询循环仍会心跳，此前任务永 running；超时整组终止并落 failed
  SPATIAL_JOB_TIMEOUT_SECONDS: "${SPATIAL_JOB_TIMEOUT_SECONDS:-21600}"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  FRONTEND_PORT: 3000
  MINER_BACKEND_PORT: 8000
  MINER_FRONTEND_PORT: 4000
  MINER_MAP_PROVIDER: "${MINER_MAP_PROVIDER:-local}"
  MINER_TDT_KEY: "${MINER_TDT_KEY:-}"
  MINER_LOCAL_TILE_URL: "${MINER_LOCAL_TILE_URL:-http://localhost:8000/tiles/{z}/{x}/{y}.png}"
  MINER_LOCAL_TMS: "${MINER_LOCAL_TMS:-0}"
  INFERENCE_ACCELERATOR: "${INFERENCE_ACCELERATOR:-auto}"
  INFERENCE_CPU_FALLBACK: "${INFERENCE_CPU_FALLBACK:-true}"
  INFERENCE_GPU_DEVICE: "${INFERENCE_GPU_DEVICE:-0}"
  INFERENCE_MAX_CONCURRENCY: "${INFERENCE_MAX_CONCURRENCY:-1}"
  INFERENCE_JOB_TIMEOUT_SECONDS: "${INFERENCE_JOB_TIMEOUT_SECONDS:-3600}"
  # gunicorn 单请求超时：standalone 同步推理（无项目上下文的语义分割）与
  # 分片 complete 的同卷合并都是分钟级长请求，默认 120s 会杀连接（2026-09-22）
  WEB_TIMEOUT_SECONDS: "${WEB_TIMEOUT_SECONDS:-1800}"
  INFERENCE_BATCH_SIZE: "${INFERENCE_BATCH_SIZE:-1}"
  INFERENCE_KEEP_FAILED_WORKDIR: "${INFERENCE_KEEP_FAILED_WORKDIR:-true}"
  INFERENCE_INPUT_ROOTS: "/app/backend/static,/app/backend/bianhua_2years,/app/miner"
  INFERENCE_OUTPUT_ROOTS: "/app/miner/change_matrix_outputs"
  INFERENCE_RUNTIME_ROOT: "/app/backend/runtime/inference_jobs"
  PROJECT_STORAGE_ROOT: "/project_storage"
  SPATIAL_TILE_PROCESSES: "${SPATIAL_TILE_PROCESSES:-4}"
  AUTO_MIGRATE_YUNNAN_SPATIAL: "${AUTO_MIGRATE_YUNNAN_SPATIAL:-1}"
  GDAL_DATA: "/opt/conda/envs/MMSeg310/share/gdal"
  PROJ_LIB: "/opt/conda/envs/MMSeg310/share/proj"
  PROJ_DATA: "/opt/conda/envs/MMSeg310/share/proj"

x-runtime-base: &runtime-base
  image: ${APP_IMAGE:-yunnan-runtime:current}
  volumes:
    - ./config.yaml:/app/config.yaml:ro
    - ./docker:/app/docker:ro
  restart: unless-stopped
  # 日志轮转（2026-11-05 生产化检查）：json-file 默认无上限，7 容器长跑会
  # 静默吃满磁盘后所有写入类功能失败；20m×3 = 每容器上限 60MB
  logging: &default-logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  backend:
    <<: *runtime-base
    container_name: yunnan-backend
    # 内存上限（2026-11-05 生产化检查）：Docker VM 仅 ~5.8GiB，无上限时任一
    # 容器失控（如超限上传的内存解析）会吃光全 VM 触发全栈 OOM 而非单容器失败
    mem_limit: 3072m
    entrypoint: ["/bin/bash", "/app/docker/start-backend.sh"]
    environment:
      <<: *app-env
    ports:
      - "5008:5008"
    depends_on:
      - mysql
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docker:/app/docker:ro
      - ./backend:/app/backend:ro
      - ./miner/yunnan.kml:/app/miner/yunnan.kml:ro
      - ./miner/NDVI_2year.xlsx:/app/miner/NDVI_2year.xlsx
      - ./miner/NDBI_by_fid_2year_avg.xlsx:/app/miner/NDBI_by_fid_2year_avg.xlsx
      - ./miner/NDWI_by_fid_2year_avg.xlsx:/app/miner/NDWI_by_fid_2year_avg.xlsx
      - ./miner/NDSI_by_fid_2year_avg.xlsx:/app/miner/NDSI_by_fid_2year_avg.xlsx
      - backend-static:/app/backend/static
      - miner-uploads:/app/miner/uploads
      - miner-outputs:/app/miner/change_matrix_outputs
      - hf-cache:/root/.cache/huggingface
      - ./project_storage:/project_storage
      - ${OFFLINE_MAP_DIR:-./maps/dali}:/project_storage/incoming/dali:ro
    healthcheck:
      # 深层探针（2026-10-24 审查 P2-12）：DB SELECT 1 + 存储根可写，
      # 替代仅验证 Flask 存活的 /api/auth/session
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5008/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    <<: *runtime-base
    container_name: yunnan-frontend
    # vue-cli(webpack) 构建峰值超 768m 会被 cgroup 杀（2026-11-05 实测 Killed
    # 循环）；构建后运行态仅 ~20MiB，上限是封顶不是预留
    mem_limit: 2048m
    entrypoint: ["/bin/bash", "/app/docker/start-frontend.sh"]
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docker:/app/docker:ro
      - ./frontend/src:/app/frontend/src:ro
      # 依赖与源码同源（2026-11-05 迁移审查 P1-5 真身）：镜像基座的 package.json/
      # node_modules 停留在构建时点，src 引用新包时启动构建必炸 MODULE_NOT_FOUND
      # （此前靠 compose 之外的手工整目录挂载漂移掩盖，recreate 后即显形）。
      # node_modules 挂 rw：vue-cli 的 cache-loader 需写 node_modules/.cache；
      # 已核实 frontend 依赖树无 native 二进制（零 .node），Windows 主树可安全共享。
      - ./frontend/package.json:/app/frontend/package.json:ro
      - ./frontend/node_modules:/app/frontend/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  miner-api:
    <<: *runtime-base
    container_name: yunnan-miner-api
    mem_limit: 512m
    entrypoint: ["/bin/bash", "/app/docker/start-miner-api.sh"]

    environment:
      <<: *app-env
      GEOVIEW_BACKEND_URL: "http://backend:5008"
      # 生产模式（2026-11-05 迁移审查 P2-15）：未设置时 Express/body-parser 走
      # dev 模式，错误页会回显堆栈（畸形 JSON 等触发），泄露内部实现
      NODE_ENV: "production"
    ports:
      - "8000:8000"
    depends_on:
      # 条件依赖：backend 就绪（含等 MySQL+初始化）前 BFF 不放行，
      # 消除重启时序 502 窗口（2026-10-27 实测；BFF 另有连接级单次重试兜底）
      backend:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docker:/app/docker:ro
      - ./miner/server.js:/app/miner/server.js:ro
      - ./miner/routes:/app/miner/routes:ro
      - ./miner/services:/app/miner/services:ro
      - ./miner/yunnan.kml:/app/miner/yunnan.kml:ro
      - ./miner/NDVI_2year.xlsx:/app/miner/NDVI_2year.xlsx:ro
      - ./miner/NDBI_by_fid_2year_avg.xlsx:/app/miner/NDBI_by_fid_2year_avg.xlsx:ro
      - ./miner/NDWI_by_fid_2year_avg.xlsx:/app/miner/NDWI_by_fid_2year_avg.xlsx:ro
      - ./miner/NDSI_by_fid_2year_avg.xlsx:/app/miner/NDSI_by_fid_2year_avg.xlsx:ro
      - miner-outputs:/app/miner/change_matrix_outputs
      - miner-uploads:/app/miner/uploads
      - backend-static:/app/backend/static
      - hf-cache:/root/.cache/huggingface
      # 只读保持（2026-10-31 架构审查）：底图上传由 BFF 流式转发到后端权威端点
      # 落盘，BFF 不落盘业务数据（受控存储接口归后端）
      - ./project_storage:/project_storage:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/auth/session >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  inference-worker:
    <<: *runtime-base
    image: ${INFERENCE_IMAGE:-yunnan-inference-worker:current}
    container_name: yunnan-inference-worker
    # CPU 回退路径加载 checkpoint 需 ~4GiB 进程内存，上限给到 4.5GiB
    mem_limit: 4608m
    entrypoint: ["/bin/bash", "/app/docker/start-inference-worker.sh"]
    environment:
      <<: *app-env
      INFERENCE_IMAGE_BUILD: "${INFERENCE_IMAGE_BUILD:-unknown}"
    depends_on:
      - mysql
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docker:/app/docker:ro
      - ./backend:/app/backend:ro
      - ./miner/yunnan.kml:/app/miner/yunnan.kml:ro
      - backend-static:/app/backend/static:ro
      - miner-uploads:/app/miner/uploads:ro
      - miner-outputs:/app/miner/change_matrix_outputs
      - inference-runtime:/app/backend/runtime/inference_jobs
      - hf-cache:/root/.cache/huggingface
      - ./project_storage:/project_storage
    # 判活依据（2026-10-24 审查 P2-12）：worker 既有的 DB 心跳——空闲期每 ≤30s
    # publish_worker_capability 刷新 InferenceWorkerState.update_time；CPU 回退下
    # 单 tile 可达分钟级时以 running 任务的进度心跳兜底（见 worker_healthcheck.py）
    healthcheck:
      test: ["CMD-SHELL", "cd /app/backend && /opt/venv/bin/python worker_healthcheck.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 300s

  spatial-worker:
    <<: *runtime-base
    container_name: yunnan-spatial-worker
    mem_limit: 2048m
    entrypoint: ["/bin/bash", "/app/docker/start-spatial-worker.sh"]
    environment:
      <<: *app-env
    depends_on:
      - mysql
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docker:/app/docker:ro
      - ./backend:/app/backend:ro
      - ./project_storage:/project_storage
      - ${OFFLINE_MAP_DIR:-./maps/dali}:/project_storage/incoming/dali:ro
    # 判活依据（2026-10-24 审查 P2-12）：DB 的 heartbeat_at 仅任务运行中存在，
    # 空闲 worker 改用心跳文件 mtime（run_forever 每 30s、任务轮询每秒 touch）
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/yunnan_spatial_worker_heartbeat) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  miner-web:
    <<: *runtime-base
    container_name: yunnan-miner-web
    mem_limit: 768m
    entrypoint: ["/bin/bash", "/app/docker/start-miner-web.sh"]
    environment:
      <<: *app-env
      VITE_MINER_API_BASE_URL: ""
      PROXY_API_TARGET: "http://miner-api:8000"
    ports:
      - "4000:4000"
    depends_on:
      - miner-api
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docker:/app/docker:ro
      - ./miner/src:/app/miner/src:ro
      - ./miner/vite.config.js:/app/miner/vite.config.js:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  mysql:
    image: ${MYSQL_IMAGE:-registry.openanolis.cn/openanolis/mysql:8.0.30-8.6}
    container_name: yunnan-mysql
    mem_limit: 1792m
    # 慢查询日志（2026-11-05 生产化检查）：>2s 的查询落 datadir 下 slow.log，
    # 排容量问题不再靠猜；轮转随数据卷备份走
    command: >
      --default-authentication-plugin=mysql_native_password
      --slow-query-log=1
      --long-query-time=2
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: paddle_rs
      MYSQL_USER: paddle_rs
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  backend-static:
    name: yunnan_backend_static
  mysql-data:
    name: yunnan_mysql_data
  hf-cache:
    name: yunnan_hf_cache
  miner-outputs:
    name: yunnan_miner_outputs
  miner-uploads:
    name: yunnan_miner_uploads
  inference-runtime:
    name: yunnan_inference_runtime
